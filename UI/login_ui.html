<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eaf8ff;
      color: #123047;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      background: #ffffff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(14, 116, 144, 0.14);
    }

    .login-title {
      margin-bottom: 8px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
    }

    .login-subtitle {
      margin-bottom: 28px;
      color: #5b7c93;
      font-size: 14px;
      text-align: center;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid #bae6fd;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 22px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #426b80;
    }

    .remember input {
      width: 14px;
      height: 14px;
    }

    a {
      color: #0284c7;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 6px;
      background: #7dd3fc;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #38bdf8;
    }

    .join-text {
      margin-top: 22px;
      color: #5b7c93;
      font-size: 14px;
      text-align: center;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 6px;
      background: #e0f7ff;
      color: #0369a1;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="login-box">
    <h1 class="login-title">로그인</h1>
    <p class="login-subtitle">계정 정보를 입력해주세요.</p>

    <form id="loginForm">
      <div class="field">
        <label for="userId">아이디</label>
        <input id="userId" type="text" placeholder="아이디를 입력하세요" required>
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호를 입력하세요" required>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox">
          로그인 유지
        </label>
        <a href="#">비밀번호 찾기</a>
      </div>

      <button type="submit">로그인</button>
      <p id="message" class="message">로그인 버튼을 눌렀습니다.</p>
    </form>

    <p class="join-text">
      계정이 없나요?
      <a href="#">회원가입</a>
    </p>
  </main>

  <script>
    const loginForm = document.querySelector("#loginForm");
    const message = document.querySelector("#message");

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();
      message.style.display = "block";
      window.location.href = "main_ui.html";
    });
  </script>
</body>
</html>
