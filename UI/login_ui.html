<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 82%, rgba(132, 202, 245, 0.32), transparent 35%),
        radial-gradient(circle at 18% 18%, rgba(219, 242, 255, 0.92), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(191, 226, 255, 0.68), transparent 28%),
        linear-gradient(180deg, #fbfdff 0%, #f2f9ff 48%, #eaf6ff 100%);
      color: #eef7ff;
      overflow-x: hidden;
    }

    .login-scene {
      position: relative;
      width: min(1120px, 100%);
      min-height: 680px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 10px;
      background:
        radial-gradient(ellipse at 50% 104%, rgba(80, 169, 231, 0.2), transparent 60%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(238, 248, 255, 0.86));
      box-shadow: 0 26px 80px rgba(43, 120, 208, 0.16);
    }

    .login-scene::before {
      content: "";
      position: absolute;
      inset: auto -8% -20% -8%;
      height: 52%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(130, 196, 236, 0.36)),
        linear-gradient(12deg, transparent 0 20%, rgba(37, 99, 235, 0.08) 21% 22%, transparent 23%),
        linear-gradient(-13deg, transparent 0 42%, rgba(147, 197, 253, 0.12) 43% 44%, transparent 45%);
      clip-path: polygon(0 52%, 16% 28%, 31% 44%, 49% 18%, 67% 47%, 82% 25%, 100% 50%, 100% 100%, 0 100%);
      opacity: 0.9;
    }

    .login-scene::after {
      content: "";
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(66, 153, 225, 0.22), transparent 62%);
      filter: blur(12px);
      transform: translateY(120px);
    }

    .login-card {
      position: relative;
      z-index: 2;
      width: min(430px, calc(100% - 40px));
      padding: 54px 38px 34px;
      border: 1px solid rgba(143, 192, 244, 0.48);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.46), transparent 46%),
        linear-gradient(180deg, rgba(225, 244, 255, 0.34), rgba(164, 211, 244, 0.14)),
        rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(155%);
      box-shadow:
        0 34px 80px rgba(43, 120, 208, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.68),
        inset 0 -42px 72px rgba(116, 191, 239, 0.1);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 150px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.42), transparent 68%);
      pointer-events: none;
    }

    .login-card::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.72), transparent);
    }

    .login-content {
      position: relative;
      z-index: 1;
    }

    .login-title {
      margin-bottom: 12px;
      color: #12345c;
      font-size: 42px;
      font-weight: 500;
      letter-spacing: 0;
      text-align: center;
    }

    .login-subtitle {
      width: min(310px, 100%);
      margin: 0 auto 42px;
      color: #5d7893;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border: 1px solid rgba(130, 188, 242, 0.64);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      color: #10233f;
      font-size: 15px;
      outline: none;
      box-shadow:
        inset 0 1px 8px rgba(255, 255, 255, 0.14),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    input::placeholder {
      color: #7f96aa;
    }

    input:focus {
      border-color: rgba(93, 177, 255, 0.92);
      box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.14),
        0 0 24px rgba(56, 189, 248, 0.12);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 18px 0 52px;
      color: #425f7b;
      font-size: 13px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: auto;
      overflow: visible;
      opacity: 1;
      white-space: nowrap;
      cursor: pointer;
    }

    .remember input {
      width: 15px;
      height: 15px;
      accent-color: #4aa3f0;
    }

    a {
      color: #236cc8;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    button {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(49, 128, 224, 0.86), rgba(116, 191, 239, 0.86));
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 14px 30px rgba(43, 120, 208, 0.18);
      transition: background 0.18s ease, transform 0.18s ease;
    }

    button:hover {
      background: linear-gradient(135deg, rgba(35, 108, 200, 0.92), rgba(82, 169, 231, 0.92));
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .join-text {
      margin-top: 22px;
      color: #5d7893;
      font-size: 13px;
      text-align: center;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(125, 211, 252, 0.28);
      border-radius: 14px;
      background: rgba(14, 116, 144, 0.18);
      color: #c9f2ff;
      font-size: 13px;
      text-align: center;
    }

    .message.error {
      border-color: rgba(248, 113, 113, 0.32);
      background: rgba(127, 29, 29, 0.28);
      color: #fecaca;
    }

    .copyright {
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 2;
      width: 100%;
      color: rgba(218, 235, 248, 0.38);
      font-size: 11px;
      text-align: center;
      transform: translateX(-50%);
    }

    @media (max-width: 720px) {
      body {
        padding: 0;
      }

      .login-scene {
        min-height: 100vh;
        border-radius: 0;
      }

      .login-card {
        width: min(390px, calc(100% - 28px));
        padding: 46px 24px 30px;
      }

      .login-title {
        font-size: 36px;
      }

      .options {
        align-items: flex-start;
        flex-direction: column;
        margin-bottom: 36px;
      }
    }
  </style>
</head>

<body>
  <main class="login-scene">
    <section class="login-card" aria-label="로그인 입력">
      <div class="login-content">
        <h1 class="login-title">로그인</h1>

        <form id="loginForm">
          <div class="field">
            <label for="userId">아이디</label>
            <input id="userId" type="text" placeholder="아이디를 입력하세요" autocomplete="username" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox">
              아이디 기억하기
            </label>
            <a href="forgot_password_ui.html">비밀번호 찾기</a>
          </div>

          <button type="submit">Log in</button>
          <p id="message" class="message">로그인 버튼을 눌렀습니다.</p>
        </form>

        <p class="join-text">
          계정이 없나요? <a href="signup_ui.html">회원가입</a>
        </p>
      </div>
    </section>

    <p class="copyright">Copyright(c) DataVault. All Rights Reserved.</p>
  </main>

  <script>
    const loginForm = document.querySelector("#loginForm");
    const message = document.querySelector("#message");
    const API_BASE = window.DATAVAULT_API_BASE || (
      ["127.0.0.1", "localhost"].includes(location.hostname) && ["5500", "5501"].includes(location.port)
        ? "http://127.0.0.1:8000"
        : ""
    );
    const registeredUserId = new URLSearchParams(location.search).get("userId");

    if (registeredUserId) {
      document.querySelector("#userId").value = registeredUserId;
      document.querySelector("#password").focus();
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.classList.remove("error");
      message.textContent = "";
      message.style.display = "none";

      const userId = document.querySelector("#userId").value;
      const password = document.querySelector("#password").value;

      try {
        loginForm.querySelector("button").disabled = true;
        const response = await fetch(`${API_BASE}/api/login`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ userId, password })
        });
        const result = await response.json();

        if (!result.ok) {
          message.classList.add("error");
          message.textContent = result.message;
          message.style.display = "block";
          return;
        }

        localStorage.setItem("accessToken", result.accessToken);
        window.location.href = "main_ui.html";
      } catch (error) {
        message.classList.add("error");
        message.textContent = "서버에 연결할 수 없습니다.";
        message.style.display = "block";
      } finally {
        loginForm.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
