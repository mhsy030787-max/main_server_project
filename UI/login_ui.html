<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #f4fbff;
      color: #10233f;
    }

    .login-shell {
      width: min(920px, 100%);
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #0753b7;
      font-size: 30px;
      font-weight: 800;
    }

    .brand-icon {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 2px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      color: #0753b7;
      font-size: 18px;
    }

    .login-frame {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) 330px;
      min-height: 420px;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 22px 55px rgba(43, 120, 208, 0.16);
    }

    .visual-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(16, 35, 63, 0.92), rgba(49, 111, 155, 0.9)),
        linear-gradient(180deg, #dff4ff, #ffffff);
      color: #ffffff;
    }

    .visual-panel::before {
      content: "";
      position: absolute;
      right: 46px;
      bottom: 82px;
      width: 190px;
      height: 120px;
      border: 10px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      background: linear-gradient(135deg, #eaf8ff, #7dd3fc);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
    }

    .visual-panel::after {
      content: "";
      position: absolute;
      right: 92px;
      bottom: 46px;
      width: 100px;
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 -28px 0 rgba(255, 255, 255, 0.5);
    }

    .visual-copy {
      position: relative;
      z-index: 1;
      max-width: 360px;
    }

    .visual-copy h1 {
      margin-bottom: 14px;
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .visual-copy p {
      color: #d8ecff;
      font-size: 15px;
      line-height: 1.7;
    }

    .visual-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      max-width: 300px;
      list-style: none;
    }

    .visual-list li {
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.11);
      color: #eef8ff;
      font-size: 13px;
      font-weight: 700;
    }

    .login-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 42px 32px;
      background: #ffffff;
    }

    .login-title {
      margin-bottom: 8px;
      color: #38a8e8;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .login-subtitle {
      margin-bottom: 26px;
      color: #5b7c93;
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #10233f;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #d7ecff;
      border-radius: 4px;
      background: #fbfdff;
      color: #10233f;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 18px;
      font-size: 12px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #426b80;
      white-space: nowrap;
    }

    .remember input {
      width: 14px;
      height: 14px;
    }

    a {
      color: #1f75d6;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }

    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 4px;
      background: #5b8def;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #3c73dc;
    }

    .join-text {
      margin-top: 22px;
      color: #5b7c93;
      font-size: 12px;
      text-align: right;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      background: #e0f7ff;
      color: #0369a1;
      font-size: 13px;
      text-align: center;
    }

    .message.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .copyright {
      margin-top: 18px;
      color: #9aaebe;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 780px) {
      body {
        align-items: flex-start;
        padding: 18px;
      }

      .login-frame {
        grid-template-columns: 1fr;
      }

      .visual-panel {
        min-height: 260px;
        padding: 30px;
      }

      .visual-panel::before,
      .visual-panel::after {
        opacity: 0.45;
      }

      .login-panel {
        padding: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="login-shell">
    <section class="brand" aria-label="서비스 이름">
      <div class="brand-mark">
        <span class="brand-icon">D</span>
        DataVault
      </div>
    </section>

    <section class="login-frame">
      <div class="visual-panel">
        <div class="visual-copy">
          <h1>SECURE MAIL SYSTEM</h1>
          <p>내부 메일, 문서 승인, 접근 로그를 하나의 보안 업무 환경에서 관리합니다.</p>
        </div>
        <ul class="visual-list">
          <li>암호화 문서 관리</li>
          <li>내부 메일망 연동</li>
          <li>접근 기록 모니터링</li>
        </ul>
      </div>

      <div class="login-panel">
        <h2 class="login-title">LOGIN</h2>
        <p class="login-subtitle">@datavault.local 내부 사용자 전용 로그인입니다.</p>

        <form id="loginForm">
          <div class="field">
            <label for="userId">아이디</label>
            <input id="userId" type="text" placeholder="아이디" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" placeholder="비밀번호" required>
          </div>

          <div class="options">
            <label class="remember">
              <input type="checkbox">
              아이디 기억하기
            </label>
            <a href="#">비밀번호 찾기</a>
          </div>

          <button type="submit">Login</button>
          <p id="message" class="message">로그인 버튼을 눌렀습니다.</p>
        </form>

        <p class="join-text">
          <a href="#">회원가입</a>
        </p>
      </div>
    </section>

    <p class="copyright">Copyright(c) DataVault. All Rights Reserved.</p>
  </main>

  <script>
    const loginForm = document.querySelector("#loginForm");
    const message = document.querySelector("#message");

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.classList.remove("error");
      message.textContent = "";
      message.style.display = "none";

      const userId = document.querySelector("#userId").value;
      const password = document.querySelector("#password").value;

      try {
        loginForm.querySelector("button").disabled = true;
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ userId, password })
        });
        const result = await response.json();

        if (!result.ok) {
          message.classList.add("error");
          message.textContent = result.message;
          message.style.display = "block";
          return;
        }

        window.location.href = "main_ui.html";
      } catch (error) {
        message.classList.add("error");
        message.textContent = "서버에 연결할 수 없습니다.";
        message.style.display = "block";
      } finally {
        loginForm.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
