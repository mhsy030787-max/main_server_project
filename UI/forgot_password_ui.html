<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 82%, rgba(132, 202, 245, 0.32), transparent 35%),
        radial-gradient(circle at 18% 18%, rgba(219, 242, 255, 0.92), transparent 30%),
        linear-gradient(180deg, #fbfdff, #eaf6ff);
      color: #10233f;
    }
    .scene {
      position: relative;
      width: min(1120px, 100%);
      min-height: 680px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.58);
      box-shadow: 0 26px 80px rgba(43, 120, 208, 0.16);
    }
    .scene::after {
      content: "";
      position: absolute;
      width: 680px;
      height: 680px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(66, 153, 225, 0.22), transparent 62%);
      transform: translateY(140px);
    }
    .card {
      position: relative;
      z-index: 1;
      width: min(450px, calc(100% - 32px));
      padding: 48px 38px 34px;
      border: 1px solid rgba(143, 192, 244, 0.48);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(28px) saturate(155%);
      box-shadow: 0 34px 80px rgba(43, 120, 208, 0.18), inset 0 1px rgba(255,255,255,.7);
    }
    h1 { margin-bottom: 12px; color: #12345c; font-size: 38px; font-weight: 500; text-align: center; }
    .subtitle { margin: 0 auto 30px; color: #5d7893; font-size: 14px; line-height: 1.6; text-align: center; }
    .field { margin-bottom: 14px; }
    label { display: block; margin: 0 8px 7px; color: #425f7b; font-size: 13px; font-weight: 800; }
    input {
      width: 100%; height: 50px; padding: 0 18px;
      border: 1px solid rgba(130, 188, 242, 0.64); border-radius: 999px;
      background: rgba(255,255,255,.28); color: #10233f; font-size: 15px; outline: none;
    }
    input:focus { border-color: #5db1ff; box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
    button {
      width: 100%; height: 54px; margin-top: 10px; border: 0; border-radius: 999px;
      background: linear-gradient(135deg, #3180e0, #74bfef); color: #fff;
      font-size: 16px; font-weight: 800; cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    .message {
      display: none; margin-top: 14px; padding: 12px 14px; border-radius: 14px;
      background: rgba(224,247,255,.72); color: #0369a1; font-size: 13px; line-height: 1.5; text-align: center;
    }
    .message.error { background: rgba(254,226,226,.8); color: #b91c1c; }
    .message a { display: block; margin-top: 8px; overflow-wrap: anywhere; }
    .back { margin-top: 20px; color: #5d7893; font-size: 13px; text-align: center; }
    a { color: #236cc8; font-weight: 800; text-decoration: none; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      body { padding: 0; }
      .scene { min-height: 100vh; border-radius: 0; }
      .card { padding: 38px 24px 30px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="card">
      <form id="requestForm">
        <h1>비밀번호 찾기</h1>
        <p class="subtitle">가입할 때 등록한 계정 정보로 재설정 링크를 받습니다.</p>
        <div class="field">
          <label for="userId">아이디</label>
          <input id="userId" autocomplete="username" maxlength="32" required>
        </div>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <button type="submit">재설정 링크 받기</button>
      </form>

      <form id="resetForm" hidden>
        <h1>새 비밀번호</h1>
        <p class="subtitle">영문과 숫자를 포함해 8자 이상 입력하세요.</p>
        <div class="field">
          <label for="password">새 비밀번호</label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <div class="field">
          <label for="passwordConfirm">비밀번호 확인</label>
          <input id="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
        </div>
        <button type="submit">비밀번호 변경</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
      <p class="back"><a href="login_ui.html">로그인으로 돌아가기</a></p>
    </section>
  </main>

  <script>
    const API_BASE = ["127.0.0.1", "localhost"].includes(location.hostname) && location.port && location.port !== "8000"
      ? "http://127.0.0.1:8000"
      : "";
    const token = new URLSearchParams(location.search).get("token") || "";
    const requestForm = document.querySelector("#requestForm");
    const resetForm = document.querySelector("#resetForm");
    const message = document.querySelector("#message");

    if (token) {
      requestForm.hidden = true;
      resetForm.hidden = false;
    }

    function showMessage(text, error = false, link = "") {
      message.classList.toggle("error", error);
      message.textContent = text;
      if (link) {
        const anchor = document.createElement("a");
        anchor.href = link;
        anchor.textContent = "로컬 테스트용 재설정 화면 열기";
        message.appendChild(anchor);
      }
      message.style.display = "block";
    }

    async function post(path, body) {
      const response = await fetch(`${API_BASE}${path}`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const button = requestForm.querySelector("button");
      button.disabled = true;
      try {
        const result = await post("/api/password-reset/request", {
          userId: document.querySelector("#userId").value.trim(),
          email: document.querySelector("#email").value.trim()
        });
        showMessage(result.message || "요청을 처리하지 못했습니다.", !result.ok, result.developmentResetUrl || "");
      } catch (error) {
        showMessage("서버에 연결할 수 없습니다.", true);
      } finally {
        button.disabled = false;
      }
    });

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.querySelector("#password").value;
      const confirmation = document.querySelector("#passwordConfirm").value;
      if (password !== confirmation) {
        showMessage("비밀번호가 서로 다릅니다.", true);
        return;
      }
      const button = resetForm.querySelector("button");
      button.disabled = true;
      try {
        const result = await post("/api/password-reset/confirm", { token, password });
        showMessage(result.message || "요청을 처리하지 못했습니다.", !result.ok);
        if (result.ok) setTimeout(() => { location.href = "login_ui.html"; }, 1000);
      } catch (error) {
        showMessage("서버에 연결할 수 없습니다.", true);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
