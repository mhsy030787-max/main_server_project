<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 관리</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div>
        <h1>사용자 관리</h1>
        <p>사용자 계정, 역할, 상태를 관리합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>사용자 목록</h2>
        <div class="toolbar">
          <input type="search" placeholder="이름 또는 아이디 검색">
          <select>
            <option>전체 역할</option>
            <option>사원</option>
            <option>팀장</option>
            <option>관리자</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>아이디</th>
              <th>역할</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>김사원</td>
              <td>staff01</td>
              <td>사원</td>
              <td><span class="badge">활성</span></td>
            </tr>
            <tr>
              <td>이팀장</td>
              <td>leader01</td>
              <td>팀장</td>
              <td><span class="badge">활성</span></td>
            </tr>
            <tr>
              <td>박관리</td>
              <td>admin01</td>
              <td>관리자</td>
              <td><span class="badge warn">점검</span></td>
            </tr>
          </tbody>
        </table>
      </article>

      <aside class="card panel">
        <h2>사용자 등록</h2>
        <form class="form">
          <label>이름
            <input type="text" placeholder="이름">
          </label>
          <label>아이디
            <input type="text" placeholder="로그인 아이디">
          </label>
          <label>역할
            <select>
              <option>사원</option>
              <option>팀장</option>
              <option>관리자</option>
            </select>
          </label>
          <button class="primary-button" type="button">사용자 추가</button>
        </form>
      </aside>
    </section>
  </main>
</body>
</html>
