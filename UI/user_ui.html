<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 관리</title>
  <link rel="stylesheet" href="service_common.css">
  <link rel="stylesheet" href="nova_theme.css">
</head>
<body data-page="users">
  <nav class="global-nav" aria-label="공통 메뉴">
    <a class="global-nav-mark" href="main_ui.html" title="DataVault">D</a>
    <a class="global-nav-link" data-nav="main" href="main_ui.html" title="대시보드">⌂</a>
    <a class="global-nav-link" data-nav="documents" href="document_ui.html" title="문서 관리">▤</a>
    <a class="global-nav-link" data-nav="mail" href="mail_ui.html" title="사내 메일">✉</a>
    <a class="global-nav-link" data-nav="logs" href="log_ui.html" title="로그 조회">◷</a>
    <a class="global-nav-link" data-nav="alerts" href="notice_ui.html" title="알림">!</a>
    <a class="global-nav-link" data-nav="schedule" href="schedule_ui.html" title="일정">□</a>
  </nav>

  <main class="page">
    <section class="topbar">
      <div>
        <h1>사용자 관리</h1>
        <p>사용자 계정, 역할, 상태를 관리합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>사용자 목록</h2>
        <div class="toolbar">
          <input data-user-search type="search" placeholder="이름 또는 아이디 검색">
          <select data-user-role>
            <option>전체 역할</option>
            <option>사원</option>
            <option>팀장</option>
            <option>관리자</option>
          </select>
        </div>
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>아이디</th>
              <th>역할</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody data-users>
          </tbody>
        </table>
      </article>

      <aside class="card panel">
        <h2>사용자 등록</h2>
        <form class="form" data-user-form>
          <label>이름
            <input name="name" type="text" placeholder="이름" required>
          </label>
          <label>아이디
            <input name="userId" type="text" placeholder="로그인 아이디" required>
          </label>
          <label>역할
            <select name="role">
              <option>사원</option>
              <option>팀장</option>
              <option>관리자</option>
            </select>
          </label>
          <button class="primary-button" type="button">사용자 추가</button>
        </form>
      </aside>
    </section>
  </main>
  <script src="nova_shell.js"></script>
  <script src="app_frontend.js"></script>
</body>
</html>
