<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>파일 업로드/다운로드</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body data-page="transfers">
  <nav class="global-nav" aria-label="공통 메뉴">
    <a class="global-nav-mark" href="main_ui.html" title="DataVault">D</a>
    <a class="global-nav-link" data-nav="main" href="main_ui.html" title="대시보드">⌂</a>
    <a class="global-nav-link" data-nav="documents" href="document_ui.html" title="문서 관리">▤</a>
    <a class="global-nav-link" data-nav="mail" href="mail_ui.html" title="사내 메일">✉</a>
    <a class="global-nav-link" data-nav="logs" href="log_ui.html" title="로그 조회">◷</a>
    <a class="global-nav-link" data-nav="alerts" href="notice_ui.html" title="알림">!</a>
    <a class="global-nav-link" data-nav="schedule" href="schedule_ui.html" title="일정">□</a>
  </nav>

  <main class="page">
    <section class="topbar">
      <div>
        <h1>파일 업로드/다운로드</h1>
        <p>암호화 파일을 업로드하고 권한에 따라 다운로드합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>파일 업로드</h2>
        <form class="form" data-transfer-form>
          <label>파일 선택
            <input name="file" type="file">
          </label>
          <label>보안 등급
            <select name="grade">
              <option>내부</option>
              <option>기밀</option>
              <option>최고기밀</option>
            </select>
          </label>
          <label>메모
            <textarea name="memo" placeholder="업로드 사유 또는 설명"></textarea>
          </label>
          <button class="primary-button" type="button">암호화 업로드</button>
        </form>
      </article>

      <aside class="card panel">
        <h2>다운로드 대기</h2>
        <ul class="list" data-transfers>
        </ul>
      </aside>
    </section>
  </main>
  <script src="app_frontend.js"></script>
</body>
</html>
