<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그 조회</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body data-page="logs">
  <main class="page">
    <section class="topbar">
      <div>
        <h1>로그 조회</h1>
        <p>접속, 업로드, 다운로드, 차단 기록을 확인합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="card panel">
      <h2>접속/다운로드 로그</h2>
      <form class="toolbar" data-log-form>
        <input name="date" type="date">
        <select name="type">
          <option>전체 이벤트</option>
          <option>로그인</option>
          <option>다운로드</option>
          <option>차단</option>
        </select>
        <input name="user" type="search" placeholder="사용자 검색">
        <button class="primary-button" type="submit">조회</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>시간</th>
            <th>사용자</th>
            <th>이벤트</th>
            <th>IP</th>
            <th>결과</th>
          </tr>
        </thead>
        <tbody data-logs>
        </tbody>
      </table>
    </section>
  </main>
  <script src="app_frontend.js"></script>
</body>
</html>
