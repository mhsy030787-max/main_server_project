<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그 조회</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div>
        <h1>로그 조회</h1>
        <p>접속, 업로드, 다운로드, 차단 기록을 확인합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="card panel">
      <h2>접속/다운로드 로그</h2>
      <div class="toolbar">
        <input type="date">
        <select>
          <option>전체 이벤트</option>
          <option>로그인</option>
          <option>다운로드</option>
          <option>차단</option>
        </select>
        <input type="search" placeholder="사용자 검색">
        <button class="primary-button" type="button">조회</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>시간</th>
            <th>사용자</th>
            <th>이벤트</th>
            <th>IP</th>
            <th>결과</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>14:58</td>
            <td>admin01</td>
            <td>로그인</td>
            <td>192.168.0.12</td>
            <td><span class="badge">성공</span></td>
          </tr>
          <tr>
            <td>14:42</td>
            <td>leader01</td>
            <td>문서 다운로드</td>
            <td>192.168.0.21</td>
            <td><span class="badge">기록</span></td>
          </tr>
          <tr>
            <td>13:20</td>
            <td>unknown</td>
            <td>외부 접근</td>
            <td>45.12.80.3</td>
            <td><span class="badge danger">차단</span></td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>
</body>
</html>
