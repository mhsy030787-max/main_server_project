<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body data-page="alerts">
  <main class="page">
    <section class="topbar">
      <div>
        <h1>알림</h1>
        <p>승인 요청, 보안 이벤트, 시스템 공지를 확인합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>알림 목록</h2>
        <ul class="list" data-alerts>
        </ul>
      </article>

      <aside class="card panel">
        <h2>알림 설정</h2>
        <form class="form" data-notice-form>
          <label>알림 대상
            <select name="target">
              <option>관리자</option>
              <option>팀장</option>
              <option>전체 사용자</option>
            </select>
          </label>
          <label>알림 종류
            <select name="type">
              <option>보안 이벤트</option>
              <option>승인 요청</option>
              <option>시스템 공지</option>
            </select>
          </label>
          <button class="primary-button" type="button">설정 저장</button>
        </form>
      </aside>
    </section>
  </main>
  <script src="app_frontend.js"></script>
</body>
</html>
