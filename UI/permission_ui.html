<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권한 관리</title>
  <link rel="stylesheet" href="service_common.css">
  <link rel="stylesheet" href="nova_theme.css">
</head>
<body data-page="permissions">
  <nav class="global-nav" aria-label="공통 메뉴">
    <a class="global-nav-mark" href="main_ui.html" title="DataVault">D</a>
    <a class="global-nav-link" data-nav="main" href="main_ui.html" title="대시보드">⌂</a>
    <a class="global-nav-link" data-nav="documents" href="document_ui.html" title="문서 관리">▤</a>
    <a class="global-nav-link" data-nav="mail" href="mail_ui.html" title="사내 메일">✉</a>
    <a class="global-nav-link" data-nav="logs" href="log_ui.html" title="로그 조회">◷</a>
    <a class="global-nav-link" data-nav="alerts" href="notice_ui.html" title="알림">!</a>
    <a class="global-nav-link" data-nav="schedule" href="schedule_ui.html" title="일정">□</a>
  </nav>

  <main class="page">
    <section class="topbar">
      <div>
        <h1>권한 관리</h1>
        <p>역할별 문서 접근, 다운로드, 승인 권한을 설정합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>역할별 권한</h2>
        <table>
          <thead>
            <tr>
              <th>역할</th>
              <th>조회</th>
              <th>업로드</th>
              <th>다운로드</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody data-permissions>
          </tbody>
        </table>
      </article>

      <aside class="card panel">
        <h2>권한 설정</h2>
        <form class="form" data-permission-form>
          <label>역할
            <select name="role">
              <option>사원</option>
              <option>팀장</option>
              <option>관리자</option>
            </select>
          </label>
          <label>대상 문서 등급
            <select name="grade">
              <option>내부</option>
              <option>기밀</option>
              <option>최고기밀</option>
            </select>
          </label>
          <label>접근 정책
            <select name="policy">
              <option>조회만 허용</option>
              <option>다운로드 허용</option>
              <option>승인 후 다운로드</option>
              <option>접근 차단</option>
            </select>
          </label>
          <button class="primary-button" type="button">정책 저장</button>
        </form>
      </aside>
    </section>
  </main>
  <script src="nova_shell.js"></script>
  <script src="app_frontend.js"></script>
</body>
</html>
