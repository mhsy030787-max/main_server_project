<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>권한 관리</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div>
        <h1>권한 관리</h1>
        <p>역할별 문서 접근, 다운로드, 승인 권한을 설정합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>역할별 권한</h2>
        <table>
          <thead>
            <tr>
              <th>역할</th>
              <th>조회</th>
              <th>업로드</th>
              <th>다운로드</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>사원</td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge warn">제한</span></td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge danger">차단</span></td>
            </tr>
            <tr>
              <td>팀장</td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge warn">팀 한정</span></td>
            </tr>
            <tr>
              <td>관리자</td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge">허용</span></td>
              <td><span class="badge">전체</span></td>
            </tr>
          </tbody>
        </table>
      </article>

      <aside class="card panel">
        <h2>권한 설정</h2>
        <form class="form">
          <label>역할
            <select>
              <option>사원</option>
              <option>팀장</option>
              <option>관리자</option>
            </select>
          </label>
          <label>대상 문서 등급
            <select>
              <option>내부</option>
              <option>기밀</option>
              <option>최고기밀</option>
            </select>
          </label>
          <label>접근 정책
            <select>
              <option>조회만 허용</option>
              <option>다운로드 허용</option>
              <option>승인 후 다운로드</option>
              <option>접근 차단</option>
            </select>
          </label>
          <button class="primary-button" type="button">정책 저장</button>
        </form>
      </aside>
    </section>
  </main>
</body>
</html>
