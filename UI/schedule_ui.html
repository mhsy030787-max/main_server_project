<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>일정 관리</title>
  <link rel="stylesheet" href="service_common.css">
  <style>
    .schedule-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 18px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .calendar-header h2 {
      margin-bottom: 0;
    }

    .calendar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .calendar-month-input {
      width: 150px;
      min-height: 34px;
      padding: 0 30px 0 10px;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #fbfdff;
      color: #0753b7;
      font-size: 13px;
      font-weight: 700;
    }

    .calendar-nav-button {
      min-width: 34px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      color: #0753b7;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .calendar-nav-button:hover {
      border-color: #1f75d6;
      background: #eaf8ff;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border: 1px solid #d7ecff;
      border-radius: 8px;
      overflow: hidden;
    }

    .calendar-weekday,
    .calendar-day {
      min-height: 92px;
      padding: 10px;
      border: 0;
      border-right: 1px solid #d7ecff;
      border-bottom: 1px solid #d7ecff;
      background: #ffffff;
      font: inherit;
    }

    button.calendar-day {
      width: 100%;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }

    button.calendar-day:hover {
      background: #f4fbff;
    }

    .calendar-weekday {
      min-height: 42px;
      background: #eaf8ff;
      color: #426b80;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .calendar-day:nth-child(7n),
    .calendar-weekday:nth-child(7n) {
      border-right: 0;
    }

    .calendar-day.muted {
      background: #f8fbfd;
      color: #9aaebe;
    }

    .calendar-day.today {
      background: #f0fbff;
      box-shadow: inset 0 0 0 2px #38bdf8;
    }

    .calendar-day.selected {
      background: #eaf8ff;
      box-shadow: inset 0 0 0 2px #1f75d6;
    }

    .day-number {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .schedule-chip {
      display: block;
      margin-top: 6px;
      padding: 5px 7px;
      border-radius: 6px;
      background: #dff4ff;
      color: #0753b7;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .selected-date-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .selected-date-header h2 {
      margin: 0;
    }

    .schedule-sections {
      display: grid;
      gap: 12px;
    }

    .schedule-section {
      overflow: hidden;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      background: #fbfdff;
    }

    .schedule-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 14px;
      background: #eaf8ff;
      color: #0753b7;
      font-size: 16px;
      font-weight: 800;
    }

    .schedule-add-button {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-color: currentColor;
      background: rgba(255, 255, 255, 0.7);
      color: inherit;
      font-size: 20px;
      line-height: 1;
    }

    .schedule-add-button:hover {
      background: #ffffff;
    }

    .schedule-section.company .schedule-section-title {
      background: #72a7dc;
      color: #ffffff;
    }

    .schedule-section.team .schedule-section-title {
      background: #d8e6f6;
      color: #10213d;
    }

    .schedule-section.personal .schedule-section-title {
      background: #eef4fb;
      color: #10213d;
    }

    .schedule-section-list {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 10px 14px 12px 34px;
    }

    .schedule-section-item,
    .schedule-empty {
      padding: 6px 0;
      color: #516b84;
      font-size: 14px;
      line-height: 1.45;
    }

    .schedule-section-item strong {
      display: block;
      color: #10213d;
      font-size: 14px;
    }

    .schedule-section-item span {
      display: block;
      margin-top: 2px;
      color: #6a839c;
      font-size: 13px;
    }

    .schedule-section-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .schedule-item-actions {
      display: flex;
      gap: 4px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 1px solid #b9d8f6;
      border-radius: 7px;
      background: #ffffff;
      color: #0753b7;
      font-size: 15px;
      cursor: pointer;
    }

    .icon-button:hover {
      border-color: #1f75d6;
      background: #eaf8ff;
    }

    .icon-button.danger {
      color: #c24141;
    }

    .schedule-dialog {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgba(16, 35, 63, 0.32);
      color: #10233f;
      backdrop-filter: blur(3px);
    }

    .schedule-dialog[hidden] {
      display: none;
    }

    .schedule-dialog form {
      width: min(520px, 100%);
      overflow: hidden;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(16, 35, 63, 0.24);
    }

    .schedule-dialog-header,
    .schedule-dialog-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 1px solid #d7ecff;
    }

    .schedule-dialog-header h2 {
      margin: 0;
      color: #0753b7;
      font-size: 20px;
    }

    .schedule-dialog-body {
      display: grid;
      gap: 14px;
      padding: 18px;
    }

    .schedule-dialog-body label {
      display: grid;
      gap: 7px;
      color: #426b80;
      font-size: 13px;
      font-weight: 800;
    }

    .schedule-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .schedule-dialog-actions {
      justify-content: flex-end;
      border-top: 1px solid #d7ecff;
      border-bottom: 0;
    }

    @media (max-width: 900px) {
      .schedule-grid {
        grid-template-columns: 1fr;
      }

      .schedule-form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="nova_theme.css">
</head>
<body data-page="schedule">
  <nav class="global-nav" aria-label="공통 메뉴">
    <a class="global-nav-mark" href="main_ui.html" title="DataVault">D</a>
    <a class="global-nav-link" data-nav="main" href="main_ui.html" title="대시보드">⌂</a>
    <a class="global-nav-link" data-nav="documents" href="document_ui.html" title="문서 관리">▤</a>
    <a class="global-nav-link" data-nav="mail" href="mail_ui.html" title="사내 메일">✉</a>
    <a class="global-nav-link" data-nav="logs" href="log_ui.html" title="로그 조회">◷</a>
    <a class="global-nav-link" data-nav="alerts" href="notice_ui.html" title="알림">!</a>
    <a class="global-nav-link" data-nav="schedule" href="schedule_ui.html" title="일정">□</a>
  </nav>

  <main class="page">
    <section class="topbar">
      <div>
        <h1>일정 관리</h1>
        <p>문서 승인, 보안 점검, 백업 일정을 캘린더로 확인합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="schedule-grid">
      <article class="card panel">
        <div class="calendar-header">
          <h2 data-calendar-title>월간 일정</h2>
          <div class="calendar-controls">
            <button class="calendar-nav-button" type="button" data-calendar-prev>‹</button>
            <input class="calendar-month-input" type="month" data-calendar-month>
            <button class="calendar-nav-button" type="button" data-calendar-next>›</button>
            <button class="calendar-nav-button" type="button" data-calendar-today>오늘</button>
          </div>
        </div>
        <div class="calendar" data-calendar></div>
      </article>

      <aside class="card panel">
        <div class="selected-date-header">
          <h2 data-selected-date-title>오늘 일정</h2>
        </div>
        <div class="schedule-sections" data-schedule-list></div>
      </aside>
    </section>
  </main>

  <div class="schedule-dialog" data-schedule-dialog role="dialog" aria-modal="true" aria-labelledby="schedule-form-title" hidden>
    <form data-schedule-form>
      <input type="hidden" name="scheduleId">
      <div class="schedule-dialog-header">
        <h2 id="schedule-form-title" data-schedule-form-title>새 일정</h2>
        <button class="icon-button" type="button" data-schedule-close title="닫기" aria-label="닫기">×</button>
      </div>
      <div class="schedule-dialog-body">
        <div class="schedule-form-row">
          <label>
            날짜
            <input type="date" name="date" required>
          </label>
          <label>
            시간
            <input type="time" name="time" required>
          </label>
        </div>
        <label>
          구분
          <select name="category" required>
            <option value="회사">회사 일정</option>
            <option value="팀">팀 일정</option>
            <option value="개인">개인 일정</option>
          </select>
        </label>
        <label>
          일정명
          <input type="text" name="title" maxlength="60" placeholder="일정명을 입력하세요" required>
        </label>
        <label>
          설명
          <textarea name="description" maxlength="240" placeholder="일정 내용을 입력하세요"></textarea>
        </label>
      </div>
      <div class="schedule-dialog-actions">
        <button class="secondary-button" type="button" data-schedule-cancel>취소</button>
        <button class="primary-button" type="submit">저장</button>
      </div>
    </form>
  </div>
  <script src="nova_shell.js"></script>
  <script src="app_frontend.js"></script>
  <script src="schedule_frontend.js"></script>
</body>
</html>
