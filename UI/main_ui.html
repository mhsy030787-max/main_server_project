<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 28px;
      background: #f4fbff;
      color: #10233f;
    }

    .dashboard {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .header h1 {
      color: #0753b7;
      font-size: 30px;
    }

    .header p {
      margin-top: 6px;
      color: #5b7c93;
      font-size: 15px;
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      color: #0753b7;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    .card {
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(43, 120, 208, 0.1);
    }

    .summary-card {
      display: block;
      padding: 18px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .summary-card:hover {
      border-color: #1f75d6;
      background: #eaf8ff;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(43, 120, 208, 0.16);
    }

    .summary-card span {
      color: #5b7c93;
      font-size: 13px;
      font-weight: 700;
    }

    .summary-card strong {
      display: block;
      margin-top: 10px;
      color: #10233f;
      font-size: 30px;
    }

    .summary-card small {
      display: block;
      margin-top: 8px;
      color: #0284c7;
      font-size: 12px;
      font-weight: 700;
    }

    .service-panel {
      margin-bottom: 18px;
      padding: 20px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .panel-header h2 {
      color: #0753b7;
      font-size: 20px;
    }

    .panel-header p {
      color: #5b7c93;
      font-size: 13px;
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .service-button {
      display: block;
      min-height: 82px;
      padding: 16px 10px;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #fbfdff;
      color: #10233f;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    .service-button:hover {
      border-color: #1f75d6;
      background: #eaf8ff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px rgba(43, 120, 208, 0.16);
    }

    .service-button strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .service-button span {
      display: block;
      color: #5b7c93;
      font-size: 12px;
      line-height: 1.4;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 18px;
    }

    .panel {
      padding: 20px;
    }

    .panel h2 {
      margin-bottom: 14px;
      color: #0753b7;
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      padding: 12px 10px;
      background: #eaf8ff;
      color: #426b80;
      text-align: left;
    }

    td {
      padding: 13px 10px;
      border-top: 1px solid #d7ecff;
    }

    .status {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .status.safe {
      background: #e0f7ff;
      color: #0369a1;
    }

    .status.wait {
      background: #fff7d6;
      color: #a16207;
    }

    .alert-list {
      display: grid;
      gap: 12px;
      list-style: none;
    }

    .alert-list li {
      padding: 14px;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      background: #fbfdff;
    }

    .alert-list strong {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .alert-list span {
      color: #5b7c93;
      font-size: 13px;
      line-height: 1.5;
    }

    .schedule-card {
      display: block;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .schedule-card:hover {
      border-color: #1f75d6;
      background: #eaf8ff;
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(43, 120, 208, 0.16);
    }

    @media (max-width: 900px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-grid,
      .main-grid,
      .service-grid {
        grid-template-columns: 1fr;
      }

      .panel-header {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body data-page="main">
  <main class="dashboard">
    <section class="header">
      <div>
        <h1>대시보드</h1>
        <p>문서 현황, 접근 기록, 보안 알림을 한눈에 확인합니다.</p>
      </div>
      <a class="user-badge" href="mypage_ui.html">마이페이지</a>
    </section>

    <section class="summary-grid">
      <a class="card summary-card" href="document_ui.html" aria-label="전체 문서 문서관리로 이동">
        <span>전체 문서</span>
        <strong id="totalDocuments">-</strong>
        <small>암호화 저장</small>
      </a>

      <a class="card summary-card" href="document_ui.html" aria-label="오늘 업로드 문서관리로 이동">
        <span>오늘 업로드</span>
        <strong id="todayUploads">-</strong>
        <small>정상 처리</small>
      </a>

      <a class="card summary-card" href="notice_ui.html?filter=%EC%8A%B9%EC%9D%B8%20%EC%9A%94%EC%B2%AD" aria-label="승인 요청 알림으로 이동">
        <span>승인 대기</span>
        <strong id="pendingApprovals">-</strong>
        <small>검토 필요</small>
      </a>

      <a class="card summary-card" href="notice_ui.html?filter=%EB%B3%B4%EC%95%88%20%EC%9D%B4%EB%B2%A4%ED%8A%B8" aria-label="보안 이벤트 알림으로 이동">
        <span>보안 알림</span>
        <strong id="securityAlerts">-</strong>
        <small>확인 필요</small>
      </a>

    </section>

    <section class="card service-panel">
      <div class="panel-header">
        <div>
          <h2>웹서비스 기능</h2>
          <p>자주 사용하는 기능을 빠르게 실행합니다.</p>
        </div>
      </div>

      <div class="service-grid">
        <a class="service-button" href="document_ui.html">
          <strong>문서 관리</strong>
          <span>업로드, 다운로드, 검색, 삭제</span>
        </a>

        <a class="service-button" href="mail_ui.html">
          <strong>사내 메일</strong>
          <span>내부 메일과 문서 첨부</span>
        </a>

        <a class="service-button" href="log_ui.html">
          <strong>로그 조회</strong>
          <span>접근과 다운로드 기록 확인</span>
        </a>

        <a class="service-button" href="notice_ui.html">
          <strong>알림</strong>
          <span>승인 요청과 알림 관리</span>
        </a>
      </div>
    </section>

    <section class="main-grid">
      <article class="card panel">
        <h2>최근 문서</h2>
        <table>
          <thead>
            <tr>
              <th>문서명</th>
              <th>소유자</th>
              <th>등급</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="documentRows">
            <tr>
              <td colspan="4">문서 정보를 불러오는 중입니다.</td>
            </tr>
          </tbody>
        </table>
      </article>

      <a class="card panel schedule-card" href="schedule_ui.html">
        <h2>오늘 일정</h2>
        <ul id="scheduleList" class="alert-list">
          <li>
            <strong>불러오는 중</strong>
            <span>오늘 일정을 가져오고 있습니다.</span>
          </li>
        </ul>
      </a>
    </section>
  </main>

  <script src="app_frontend.js"></script>
</body>
</html>
