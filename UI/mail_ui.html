<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 메일</title>
  <link rel="stylesheet" href="service_common.css">
  <style>
    .page {
      max-width: 1280px;
    }

    .mail-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 18px;
    }

    .mail-nav {
      display: grid;
      gap: 10px;
    }

    .mail-tab {
      min-height: 44px;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      color: #0753b7;
      font-weight: 800;
      cursor: pointer;
    }

    .mail-tab.active {
      background: #dff4ff;
      border-color: #1f75d6;
    }

    .compose-tab {
      background: #7dd3fc;
      border-color: #7dd3fc;
      color: #ffffff;
    }

    .compose-tab.active {
      background: #38bdf8;
      border-color: #1f75d6;
      color: #ffffff;
    }

    .mail-main {
      min-height: 640px;
    }

    .mail-view {
      display: none;
    }

    .mail-view.active {
      display: block;
    }

    .mail-list {
      display: grid;
      gap: 10px;
      list-style: none;
    }

    .mail-item {
      padding: 14px;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      background: #fbfdff;
      cursor: pointer;
    }

    .mail-item:hover,
    .mail-item.active {
      border-color: #1f75d6;
      background: #eaf8ff;
    }

    .mail-item strong {
      display: block;
      margin-bottom: 6px;
    }

    .mail-meta {
      color: #5b7c93;
      font-size: 12px;
      line-height: 1.5;
    }

    .mail-detail {
      display: grid;
      gap: 14px;
    }

    .mail-detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #d7ecff;
    }

    .mail-detail-body {
      min-height: 300px;
      padding: 18px;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      background: #fbfdff;
      line-height: 1.7;
    }

    .mail-detail-actions,
    .mail-form-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .mail-form-actions .primary-button {
      flex: 1 1 220px;
    }

    .mail-form-actions .secondary-button {
      flex: 0 0 auto;
      min-height: 44px;
    }

    .mail-item[data-mail-id] {
      width: 100%;
      text-align: left;
    }

    .mail-item-status {
      display: inline-block;
      margin-left: 6px;
      color: #0753b7;
      font-size: 11px;
      font-weight: 800;
    }

    .mail-danger-button {
      border-color: #e6a7a7;
      color: #a63232;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    .domain-note {
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      background: #fbfdff;
      color: #5b7c93;
      font-size: 13px;
      line-height: 1.5;
    }

    .mail-compose-form {
      max-width: 720px;
    }

    .mail-compose-form textarea {
      min-height: 170px;
    }

    .attachment-picker {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      padding: 0 12px;
      border: 1px dashed #8db9ed;
      border-radius: 8px;
      background: #f4fbff;
      color: #0753b7;
      font-size: 13px;
      font-weight: 800;
    }

    .attachment-picker.drag-over {
      border-color: #1f75d6;
      background: #eaf8ff;
    }

    .attachment-picker input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .mail-file-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      min-width: 76px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      color: #0753b7;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .attachment-name {
      color: #0753b7;
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @media (max-width: 1000px) {
      .mail-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="nova_theme.css">
</head>
<body data-page="mail">
  <nav class="global-nav" aria-label="공통 메뉴">
    <a class="global-nav-mark" href="main_ui.html" title="DataVault">D</a>
    <a class="global-nav-link" data-nav="main" href="main_ui.html" title="대시보드">⌂</a>
    <a class="global-nav-link" data-nav="documents" href="document_ui.html" title="문서 관리">▤</a>
    <a class="global-nav-link" data-nav="mail" href="mail_ui.html" title="통합 메일">✉</a>
    <a class="global-nav-link" data-nav="logs" href="log_ui.html" title="로그 조회">◷</a>
    <a class="global-nav-link" data-nav="alerts" href="notice_ui.html" title="알림">!</a>
    <a class="global-nav-link" data-nav="schedule" href="schedule_ui.html" title="일정">□</a>
  </nav>

  <main class="page">
    <section class="topbar">
      <div>
        <h1>통합 메일</h1>
        <p>사내 사용자와 외부 이메일 주소로 업무 메일을 주고받습니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="mail-layout">
      <aside class="card panel">
        <h2>메일함</h2>
        <nav class="mail-nav">
          <button class="mail-tab active" type="button" data-mail-box="inbox">받은 메일함</button>
          <button class="mail-tab" type="button" data-mail-box="sent">보낸 메일함</button>
          <button class="mail-tab" type="button" data-mail-box="draft">임시보관함</button>
          <button class="mail-tab" type="button" data-mail-box="trash">휴지통</button>
          <button class="mail-tab compose-tab" type="button" data-mail-compose>메일 작성</button>
        </nav>
      </aside>

      <article class="card panel mail-main">
        <section class="mail-view active" data-mail-list-view>
          <h2 data-mail-title>받은 메일함</h2>
          <ul class="mail-list" data-mail-list></ul>
        </section>

        <section class="mail-view" data-mail-detail-view>
          <div class="mail-detail" data-mail-detail></div>
        </section>

        <section class="mail-view" data-mail-compose-view>
          <h2 data-mail-compose-title>메일 작성</h2>
          <div class="domain-note" data-mail-capability>
            메일 서버 설정을 확인하는 중입니다.
          </div>
          <form class="form mail-compose-form" data-mail-form>
            <input name="messageId" type="hidden" data-mail-message-id>
            <label>받는 사람
              <input name="to" type="email" list="mailRecipients" placeholder="예: staff01@datavault.local 또는 user@example.com" required>
              <datalist id="mailRecipients" data-mail-recipients></datalist>
            </label>
            <label>제목
              <input name="subject" type="text" placeholder="메일 제목" required>
            </label>
            <div class="attachment-picker" data-mail-attachment-drop>
              <span class="attachment-name" data-mail-attachment-name>파일을 끌어다 놓거나 파일 추가를 누르세요</span>
              <label class="mail-file-button" for="mailAttachmentFile">
                파일 추가
                <input id="mailAttachmentFile" name="attachmentFile" type="file" data-mail-attachment-file>
              </label>
            </div>
            <label>보안 등급
              <select name="grade">
                <option>내부</option>
                <option>기밀</option>
                <option>최고기밀</option>
              </select>
            </label>
            <label>본문
              <textarea name="body" placeholder="메일 내용을 입력하세요" required></textarea>
            </label>
            <div class="mail-form-actions">
              <button class="primary-button" type="submit" data-mail-send>메일 보내기</button>
              <button class="secondary-button" type="button" data-mail-save-draft>임시 저장</button>
            </div>
          </form>
        </section>
      </article>
    </section>
  </main>
  <script src="nova_shell.js"></script>
  <script src="mail_frontend.js"></script>
  <script src="app_frontend.js"></script>
</body>
</html>
