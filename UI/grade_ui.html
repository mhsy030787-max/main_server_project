<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>등급 관리</title>
  <link rel="stylesheet" href="service_common.css">
</head>
<body data-page="grades">
  <nav class="global-nav" aria-label="공통 메뉴">
    <a class="global-nav-mark" href="main_ui.html" title="DataVault">D</a>
    <a class="global-nav-link" data-nav="main" href="main_ui.html" title="대시보드">⌂</a>
    <a class="global-nav-link" data-nav="documents" href="document_ui.html" title="문서 관리">▤</a>
    <a class="global-nav-link" data-nav="mail" href="mail_ui.html" title="사내 메일">✉</a>
    <a class="global-nav-link" data-nav="logs" href="log_ui.html" title="로그 조회">◷</a>
    <a class="global-nav-link" data-nav="alerts" href="notice_ui.html" title="알림">!</a>
    <a class="global-nav-link" data-nav="schedule" href="schedule_ui.html" title="일정">□</a>
  </nav>

  <main class="page">
    <section class="topbar">
      <div>
        <h1>등급 관리</h1>
        <p>문서 보안 등급과 등급별 처리 정책을 관리합니다.</p>
      </div>
      <a class="back-link" href="main_ui.html">대시보드로</a>
    </section>

    <section class="grid">
      <article class="card panel">
        <h2>보안 등급</h2>
        <table>
          <thead>
            <tr>
              <th>등급</th>
              <th>설명</th>
              <th>다운로드 정책</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody data-grades>
          </tbody>
        </table>
      </article>

      <aside class="card panel">
        <h2>등급 정책 추가</h2>
        <form class="form" data-grade-form>
          <label>등급명
            <input name="name" type="text" placeholder="예: 대외비" required>
          </label>
          <label>다운로드 정책
            <select name="policy">
              <option>권한 내 허용</option>
              <option>승인 후 허용</option>
              <option>다운로드 차단</option>
            </select>
          </label>
          <label>설명
            <textarea name="description" placeholder="등급 설명을 입력하세요"></textarea>
          </label>
          <button class="primary-button" type="button">등급 저장</button>
        </form>
      </aside>
    </section>
  </main>
  <script src="app_frontend.js"></script>
</body>
</html>
