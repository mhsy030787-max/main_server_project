<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: #f4fbff;
      color: #10233f;
    }

    .signup-shell {
      width: min(920px, 100%);
    }

    .brand {
      margin-bottom: 18px;
      text-align: center;
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #0753b7;
      font-size: 30px;
      font-weight: 800;
    }

    .brand-icon {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 2px solid #8db9ed;
      border-radius: 8px;
      background: #ffffff;
      color: #0753b7;
      font-size: 18px;
    }

    .signup-frame {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) 370px;
      min-height: 500px;
      border: 1px solid #d7ecff;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 22px 55px rgba(43, 120, 208, 0.16);
    }

    .visual-panel {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 44px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(16, 35, 63, 0.92), rgba(49, 111, 155, 0.9)),
        linear-gradient(180deg, #dff4ff, #ffffff);
      color: #ffffff;
    }

    .visual-panel::before {
      content: "";
      position: absolute;
      right: 48px;
      bottom: 78px;
      width: 178px;
      height: 118px;
      border: 10px solid rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      background: linear-gradient(135deg, #eaf8ff, #7dd3fc);
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
    }

    .visual-panel::after {
      content: "";
      position: absolute;
      right: 90px;
      bottom: 44px;
      width: 100px;
      height: 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 -28px 0 rgba(255, 255, 255, 0.5);
    }

    .visual-copy {
      position: relative;
      z-index: 1;
      max-width: 360px;
    }

    .visual-copy h1 {
      margin-bottom: 14px;
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .visual-copy p {
      color: #d8ecff;
      font-size: 15px;
      line-height: 1.7;
    }

    .visual-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      max-width: 300px;
      list-style: none;
    }

    .visual-list li {
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.11);
      color: #eef8ff;
      font-size: 13px;
      font-weight: 700;
    }

    .signup-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 38px 32px;
      background: #ffffff;
    }

    .signup-title {
      margin-bottom: 8px;
      color: #38a8e8;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .signup-subtitle {
      margin-bottom: 24px;
      color: #5b7c93;
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #10233f;
      font-size: 13px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #d7ecff;
      border-radius: 4px;
      background: #fbfdff;
      color: #10233f;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.18);
    }

    button {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: 4px;
      background: #5b8def;
      color: #ffffff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: #3c73dc;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .login-link {
      margin-top: 18px;
      color: #5b7c93;
      font-size: 12px;
      text-align: right;
    }

    a {
      color: #1f75d6;
      text-decoration: none;
      font-weight: 700;
    }

    a:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      background: #e0f7ff;
      color: #0369a1;
      font-size: 13px;
      text-align: center;
    }

    .message.error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .copyright {
      margin-top: 18px;
      color: #9aaebe;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 820px) {
      body {
        align-items: flex-start;
        padding: 18px;
      }

      .signup-frame {
        grid-template-columns: 1fr;
      }

      .visual-panel {
        min-height: 250px;
        padding: 30px;
      }

      .visual-panel::before,
      .visual-panel::after {
        opacity: 0.45;
      }

      .signup-panel {
        padding: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="signup-shell">
    <section class="brand" aria-label="서비스 이름">
      <div class="brand-mark">
        <span class="brand-icon">D</span>
        DataVault
      </div>
    </section>

    <section class="signup-frame">
      <div class="visual-panel">
        <div class="visual-copy">
          <h1>SECURE ACCOUNT</h1>
          <p>내부 사용자 계정을 등록하고 문서, 메일, 접근 기록을 같은 보안 환경에서 관리합니다.</p>
        </div>
        <ul class="visual-list">
          <li>역할 기반 계정 등록</li>
          <li>JWT 인증 연동 준비</li>
          <li>세션 기반 접속 관리</li>
        </ul>
      </div>

      <div class="signup-panel">
        <h2 class="signup-title">SIGN UP</h2>
        <p class="signup-subtitle">@datavault.local 내부 사용자 계정을 생성합니다.</p>

        <form id="signupForm">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" type="text" placeholder="예: 김사원" required>
          </div>

          <div class="field">
            <label for="userId">아이디</label>
            <input id="userId" type="text" placeholder="로그인에 사용할 아이디" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" placeholder="비밀번호" required>
          </div>

          <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" type="password" placeholder="비밀번호를 한 번 더 입력" required>
          </div>

          <div class="field">
            <label for="role">역할</label>
            <select id="role">
              <option value="사원">사원</option>
              <option value="팀장">팀장</option>
              <option value="관리자">관리자</option>
            </select>
          </div>

          <button type="submit">회원가입</button>
          <p id="message" class="message"></p>
        </form>

        <p class="login-link">
          이미 계정이 있나요? <a href="login_ui.html">로그인</a>
        </p>
      </div>
    </section>

    <p class="copyright">Copyright(c) DataVault. All Rights Reserved.</p>
  </main>

  <script>
    const signupForm = document.querySelector("#signupForm");
    const message = document.querySelector("#message");
    const API_BASE = ["127.0.0.1", "localhost"].includes(location.hostname) && location.port && location.port !== "8000"
      ? "http://127.0.0.1:8000"
      : "";

    function showMessage(text, isError) {
      message.textContent = text;
      message.classList.toggle("error", isError);
      message.style.display = "block";
    }

    signupForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      message.style.display = "none";
      message.classList.remove("error");

      const name = document.querySelector("#name").value.trim();
      const userId = document.querySelector("#userId").value.trim();
      const password = document.querySelector("#password").value;
      const passwordConfirm = document.querySelector("#passwordConfirm").value;
      const role = document.querySelector("#role").value;

      if (password !== passwordConfirm) {
        showMessage("비밀번호가 서로 다릅니다.", true);
        return;
      }

      try {
        signupForm.querySelector("button").disabled = true;
        const response = await fetch(`${API_BASE}/api/register`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, userId, password, role })
        });
        const result = await response.json();

        if (!result.ok) {
          showMessage(result.message || "회원가입에 실패했습니다.", true);
          return;
        }

        showMessage("회원가입이 완료되었습니다. 로그인 화면으로 이동합니다.", false);
        setTimeout(function () {
          window.location.href = "login_ui.html";
        }, 900);
      } catch (error) {
        showMessage("서버에 연결할 수 없습니다.", true);
      } finally {
        signupForm.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
