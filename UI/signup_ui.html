<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        radial-gradient(circle at 50% 82%, rgba(132, 202, 245, 0.32), transparent 35%),
        radial-gradient(circle at 18% 18%, rgba(219, 242, 255, 0.92), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(191, 226, 255, 0.68), transparent 28%),
        linear-gradient(180deg, #fbfdff 0%, #f2f9ff 48%, #eaf6ff 100%);
      color: #10233f;
      overflow-x: hidden;
    }

    .signup-scene {
      position: relative;
      width: min(1120px, 100%);
      min-height: 740px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 10px;
      background:
        radial-gradient(ellipse at 50% 104%, rgba(80, 169, 231, 0.2), transparent 60%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(238, 248, 255, 0.86));
      box-shadow: 0 26px 80px rgba(43, 120, 208, 0.16);
    }

    .signup-scene::before {
      content: "";
      position: absolute;
      inset: auto -8% -20% -8%;
      height: 52%;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(130, 196, 236, 0.36)),
        linear-gradient(12deg, transparent 0 20%, rgba(37, 99, 235, 0.08) 21% 22%, transparent 23%),
        linear-gradient(-13deg, transparent 0 42%, rgba(147, 197, 253, 0.12) 43% 44%, transparent 45%);
      clip-path: polygon(0 52%, 16% 28%, 31% 44%, 49% 18%, 67% 47%, 82% 25%, 100% 50%, 100% 100%, 0 100%);
      opacity: 0.9;
    }

    .signup-scene::after {
      content: "";
      position: absolute;
      width: 720px;
      height: 720px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(66, 153, 225, 0.22), transparent 62%);
      filter: blur(12px);
      transform: translateY(120px);
    }

    .signup-card {
      position: relative;
      z-index: 2;
      width: min(470px, calc(100% - 40px));
      padding: 48px 38px 34px;
      border: 1px solid rgba(143, 192, 244, 0.48);
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.46), transparent 46%),
        linear-gradient(180deg, rgba(225, 244, 255, 0.34), rgba(164, 211, 244, 0.14)),
        rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px) saturate(155%);
      box-shadow:
        0 34px 80px rgba(43, 120, 208, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.68),
        inset 0 -42px 72px rgba(116, 191, 239, 0.1);
      overflow: hidden;
    }

    .signup-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 150px;
      background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.42), transparent 68%);
      pointer-events: none;
    }

    .signup-card::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.72), transparent);
    }

    .signup-content {
      position: relative;
      z-index: 1;
    }

    .signup-title {
      margin-bottom: 12px;
      color: #12345c;
      font-size: 40px;
      font-weight: 500;
      letter-spacing: 0;
      text-align: center;
    }

    .signup-subtitle {
      width: min(340px, 100%);
      margin: 0 auto 30px;
      color: #5d7893;
      font-size: 14px;
      line-height: 1.55;
      text-align: center;
    }

    .field {
      margin-bottom: 13px;
    }

    .field-help {
      margin: 7px 8px 0;
      color: #6b8299;
      font-size: 12px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #425f7b;
      font-size: 13px;
      font-weight: 800;
    }

    input {
      width: 100%;
      height: 48px;
      padding: 0 18px;
      border: 1px solid rgba(130, 188, 242, 0.64);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      color: #10233f;
      font-size: 15px;
      outline: none;
      box-shadow:
        inset 0 1px 8px rgba(255, 255, 255, 0.14),
        0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    input::placeholder {
      color: #7f96aa;
    }

    input:focus {
      border-color: rgba(93, 177, 255, 0.92);
      box-shadow:
        0 0 0 4px rgba(37, 99, 235, 0.14),
        0 0 24px rgba(56, 189, 248, 0.12);
    }

    button {
      width: 100%;
      height: 54px;
      margin-top: 10px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(49, 128, 224, 0.86), rgba(116, 191, 239, 0.86));
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 14px 30px rgba(43, 120, 208, 0.18);
      transition: background 0.18s ease, transform 0.18s ease;
    }

    button:hover {
      background: linear-gradient(135deg, rgba(35, 108, 200, 0.92), rgba(82, 169, 231, 0.92));
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
      transform: none;
    }

    .login-link {
      margin-top: 20px;
      color: #5d7893;
      font-size: 13px;
      text-align: center;
    }

    a {
      color: #236cc8;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid rgba(125, 211, 252, 0.28);
      border-radius: 14px;
      background: rgba(224, 247, 255, 0.64);
      color: #0369a1;
      font-size: 13px;
      text-align: center;
    }

    .message.error {
      border-color: rgba(248, 113, 113, 0.32);
      background: rgba(254, 226, 226, 0.74);
      color: #b91c1c;
    }

    .copyright {
      position: absolute;
      left: 50%;
      bottom: 34px;
      z-index: 2;
      width: 100%;
      color: rgba(93, 120, 147, 0.48);
      font-size: 11px;
      text-align: center;
      transform: translateX(-50%);
    }

    @media (max-width: 720px) {
      body {
        padding: 0;
      }

      .signup-scene {
        min-height: 100vh;
        border-radius: 0;
      }

      .signup-card {
        width: min(420px, calc(100% - 28px));
        padding: 38px 24px 30px;
      }

      .signup-title {
        font-size: 34px;
      }

      input {
        height: 46px;
      }
    }
  </style>
  <link rel="stylesheet" href="nova_theme.css">
</head>

<body>
  <main class="signup-scene">
    <section class="signup-card" aria-label="회원가입 입력">
      <div class="signup-content">
        <h1 class="signup-title">회원 가입</h1>

        <form id="signupForm">
          <div class="field">
            <label for="name">이름</label>
            <input id="name" type="text" placeholder="예: 김사원" autocomplete="name" minlength="2" maxlength="30" required>
          </div>

          <div class="field">
            <label for="userId">아이디</label>
            <input id="userId" type="text" placeholder="로그인에 사용할 아이디" autocomplete="username" minlength="4" maxlength="32" pattern="[A-Za-z0-9_]+" required>
            <p class="field-help">영문, 숫자, 밑줄을 사용해 4~32자로 입력하세요.</p>
          </div>

          <div class="field">
            <label for="email">이메일</label>
            <input id="email" type="email" placeholder="비밀번호 찾기에 사용할 이메일" autocomplete="email" maxlength="254" required>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" type="password" placeholder="비밀번호" autocomplete="new-password" minlength="8" maxlength="128" required>
            <p class="field-help">영문과 숫자를 포함해 8자 이상 입력하세요.</p>
          </div>

          <div class="field">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" type="password" placeholder="비밀번호를 한 번 더 입력" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>

          <button type="submit">회원가입</button>
          <p id="message" class="message"></p>
        </form>

        <p class="login-link">
          이미 계정이 있나요? <a href="login_ui.html">로그인</a>
        </p>
      </div>
    </section>

    <p class="copyright">Copyright(c) DataVault. All Rights Reserved.</p>
  </main>

  <script>
    const signupForm = document.querySelector("#signupForm");
    const message = document.querySelector("#message");
    const API_BASE = window.DATAVAULT_API_BASE || (
      ["127.0.0.1", "localhost"].includes(location.hostname) && ["5500", "5501"].includes(location.port)
        ? "http://127.0.0.1:8000"
        : ""
    );

    function showMessage(text, isError) {
      message.textContent = text;
      message.classList.toggle("error", isError);
      message.style.display = "block";
    }

    signupForm.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      message.style.display = "none";
      message.classList.remove("error");

      const name = document.querySelector("#name").value.trim();
      const userId = document.querySelector("#userId").value.trim();
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;
      const passwordConfirm = document.querySelector("#passwordConfirm").value;

      if (!/^[A-Za-z0-9_]{4,32}$/.test(userId)) {
        showMessage("아이디는 영문, 숫자, 밑줄을 사용해 4~32자로 입력하세요.", true);
        return;
      }

      if (password.length < 8 || !/[A-Za-z]/.test(password) || !/\d/.test(password)) {
        showMessage("비밀번호에는 영문과 숫자를 포함해 8자 이상 입력하세요.", true);
        return;
      }

      if (password !== passwordConfirm) {
        showMessage("비밀번호가 서로 다릅니다.", true);
        return;
      }

      try {
        signupForm.querySelector("button").disabled = true;
        const response = await fetch(`${API_BASE}/api/register`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, userId, email, password })
        });
        const result = await response.json();

        if (!result.ok) {
          showMessage(result.message || "회원가입에 실패했습니다.", true);
          return;
        }

        showMessage("회원가입이 완료되었습니다. 로그인 화면으로 이동합니다.", false);
        setTimeout(function () {
          window.location.href = `login_ui.html?userId=${encodeURIComponent(result.user.id)}`;
        }, 900);
      } catch (error) {
        showMessage("서버에 연결할 수 없습니다.", true);
      } finally {
        signupForm.querySelector("button").disabled = false;
      }
    });
  </script>
</body>
</html>
