services:
  - type: web
    name: main-server-project
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: HOST=0.0.0.0 python3 backend/app.py
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://main-server-project.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SENDER
        sync: false
      - key: SMTP_STARTTLS
        value: true
      - key: EXPOSE_RESET_LINK
        value: false
