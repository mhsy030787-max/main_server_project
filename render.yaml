services:
  - type: web
    name: main-server-project
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: HOST=0.0.0.0 python3 backend/app.py
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL_MODE
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://main-server-project.onrender.com
      - key: MAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_FROM_DOMAIN
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: MAIL_PUBLIC_DOMAIN
        sync: false
      - key: MAIL_ALLOW_CLASSIFIED_EXTERNAL
        value: false
      - key: EXPOSE_RESET_LINK
        value: false
